[project]
name = "bat_jester_model_training"
version = "0.1.0"
requires-python = ">=3.10,<3.13"

dependencies = [
    "ruff",
    "numpy",
    "librosa",
    "pandas",
    "matplotlib",
    "ipykernel",
    "jupyterlab",
    "pip",
    "notebook",
    "skl2onnx",
    "onnxruntime",
    "tensorflow",
    "tensorflow_hub",
    "pywavelets",
    "ultralytics>=8.3.228",
    "opencv-python>=4.12.0.88",
    "moviepy>=2.2.1",
    "pyarrow>=21.0.0",
    "openai-whisper>=20250625",
    "mcp>=1.3.0",
    "httpx>=0.27.0",
    "httpx-sse>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black"
]

[tool.ruff]
line-length = 88
target-version = "py310"
